apiVersion: v1
kind: ConfigMap
metadata:
  name: payments-api-config
  namespace: default
  labels:
    app.kubernetes.io/name: payments-api
    app.kubernetes.io/part-of: devpilot-ai
data:
    ENVIRONMENT: "production"
    LOG_LEVEL: "info"
    PORT: "8080"---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: default
  labels:
    app.kubernetes.io/name: payments-api
    app.kubernetes.io/part-of: devpilot-ai
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: payments-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: payments-api
        image: devpilot/payments-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        envFrom:
        - configMapRef:
            name: payments-api-config
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2---
apiVersion: v1
kind: Service
metadata:
  name: payments-api-service
  namespace: default
  labels:
    app.kubernetes.io/name: payments-api
    app.kubernetes.io/part-of: devpilot-ai
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: payments-api
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payments-api-hpa
  namespace: default
  labels:
    app.kubernetes.io/name: payments-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payments-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payments-api-ingress
  namespace: default
  labels:
    app.kubernetes.io/name: payments-api
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
  - host: payments-api.devpilot.internal
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: payments-api-service
            port:
              number: 80
